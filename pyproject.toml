[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "xcorr"
version = "0.1.0"
description = "Explainable multi-tool smart-contract vulnerability correlation research framework"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12,<3.13"
keywords = [
    "program-analysis",
    "research",
    "smart-contracts",
    "software-engineering",
    "vulnerability-correlation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.2,<3",
    "PyYAML>=6.0.3,<7",
    "structlog>=26.1.0,<27",
]

[project.optional-dependencies]
research = [
    "matplotlib>=3.9,<4",
    "networkx>=3.3,<4",
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "seaborn>=0.13.2,<1",
    "statsmodels>=0.14.2,<1",
]
dev = [
    "build>=1.2.2,<2",
    "mypy>=1.11,<2",
    "pip-audit>=2.7.3,<3",
    "pre-commit>=3.8,<5",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5,<8",
    "pytest-mock>=3.14,<4",
    "ruff>=0.6,<1",
    "types-PyYAML>=6.0.12,<7",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=0.26,<1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
    "analyzers*",
    "correlation*",
    "evaluation*",
    "explainability*",
    "orchestrator*",
    "statistics*",
]
exclude = [
    "datasets*",
    "docker*",
    "docs*",
    "experiments*",
    "figures*",
    "paper*",
    "reports*",
    "scripts*",
    "tests*",
]
namespaces = false

[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "experiments/runs",
    "figures/generated",
    "paper/build",
    "reports/generated",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "D203",
    "D213",
    "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "PLR2004",
    "S101",
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
ignore-fully-untyped = false
mypy-init-return = true
suppress-dummy-args = false
suppress-none-returning = false

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "pydantic.Field",
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "tuple"
parametrize-values-row-type = "tuple"
parametrize-values-type = "list"
raises-extend-require-match-for = [
    "Exception",
    "RuntimeError",
    "ValueError",
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = [
    "analyzers",
    "correlation",
    "evaluation",
    "explainability",
    "orchestrator",
    "statistics",
]
required-imports = [
    "from __future__ import annotations",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
files = ["."]
exclude = [
    "^\\.venv/",
    "^build/",
    "^dist/",
    "^experiments/runs/",
    "^figures/generated/",
    "^paper/build/",
    "^reports/generated/",
]
show_error_codes = true
show_error_context = true
show_column_numbers = true
pretty = true
color_output = true
error_summary = true
warn_unreachable = true
warn_unused_configs = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=.",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml:reports/coverage.xml",
    "--cov-report=html:reports/coverage-html",
    "--durations=10",
    "-ra",
]
xfail_strict = true
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)s %(name)s %(message)s"
log_cli_date_format = "%Y-%m-%dT%H:%M:%S%z"
filterwarnings = [
    "error",
]
markers = [
    "contract: analyzer and boundary contract tests",
    "integration: tests requiring multiple application components",
    "reproducibility: deterministic execution and artifact integrity tests",
    "slow: tests excluded from rapid local feedback",
]

[tool.coverage.run]
branch = true
parallel = true
relative_files = true
source = ["."]
omit = [
    ".venv/*",
    "build/*",
    "dist/*",
    "experiments/runs/*",
    "figures/generated/*",
    "paper/build/*",
    "reports/generated/*",
    "tests/*",
]

[tool.coverage.paths]
source = [
    ".",
    "/workspace",
]

[tool.coverage.report]
fail_under = 90
precision = 2
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.coverage.xml]
output = "reports/coverage.xml"

[tool.coverage.html]
directory = "reports/coverage-html"
